name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (e.g. 0.1.0)
        required: false
        type: string

permissions:
  contents: write
  # SignPath pulls the unsigned Windows installer via the Actions artifact API.
  actions: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  REPO_DIR: app
  APP_NAME: danmo-work

jobs:
  macos-desktop:
    name: macOS desktop
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ${{ env.REPO_DIR }}

      - name: Checkout dq-ui
        uses: actions/checkout@v6
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install & build dq-ui workspace
        working-directory: dq-ui
        run: npm install --no-audit --no-fund
      - name: Build dq-ui packages
        run: npm run build
        working-directory: dq-ui/packages/tokens
      - run: npm run build
        working-directory: dq-ui/packages/ui
      - run: npm run build
        working-directory: dq-ui/packages/shell

      - name: Set release version
        working-directory: ${{ env.REPO_DIR }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Inject version into config files
        working-directory: ${{ env.REPO_DIR }}
        run: |
          V="$RELEASE_VERSION"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" desktop/src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" frontend/package.json
          rm -f desktop/src-tauri/tauri.conf.json.bak desktop/src-tauri/Cargo.toml.bak frontend/package.json.bak
          echo "Version set to $V"

      - name: Prepare Tauri signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          ${{ env.REPO_DIR }}/scripts/ci_prepare_tauri_signing_key.sh

      - name: Build macOS desktop
        working-directory: ${{ env.REPO_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/*.sh
          make pack-macos-desktop RELEASE_VERSION="$RELEASE_VERSION"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: danmo-work-desktop-macos
          path: |
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.dmg
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.app.tar.gz
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.app.tar.gz.sig
          if-no-files-found: error

  linux-desktop:
    name: Linux desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ${{ env.REPO_DIR }}

      - name: Checkout dq-ui
        uses: actions/checkout@v6
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install & build dq-ui workspace
        working-directory: dq-ui
        run: npm install --no-audit --no-fund
      - name: Build dq-ui packages
        run: npm run build
        working-directory: dq-ui/packages/tokens
      - run: npm run build
        working-directory: dq-ui/packages/ui
      - run: npm run build
        working-directory: dq-ui/packages/shell

      - name: Set release version
        working-directory: ${{ env.REPO_DIR }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Inject version into config files
        working-directory: ${{ env.REPO_DIR }}
        run: |
          V="$RELEASE_VERSION"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" desktop/src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" frontend/package.json
          rm -f desktop/src-tauri/tauri.conf.json.bak desktop/src-tauri/Cargo.toml.bak frontend/package.json.bak
          echo "Version set to $V"

      - name: Prepare Tauri signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          ${{ env.REPO_DIR }}/scripts/ci_prepare_tauri_signing_key.sh

      - name: Build Linux desktop
        working-directory: ${{ env.REPO_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/*.sh
          make pack-linux-desktop RELEASE_VERSION="$RELEASE_VERSION"

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: danmo-work-desktop-linux
          path: |
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.AppImage
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.AppImage.sig
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.AppImage.tar.gz
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.AppImage.tar.gz.sig
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.deb
          if-no-files-found: error

  # Optional OCI env image — separate Release assets (amd64 + arm64), NOT in app packages.
  linux-env-tar:
    name: Linux env image tar (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ${{ env.REPO_DIR }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent env tar (OCI save, no registry)
        working-directory: ${{ env.REPO_DIR }}
        env:
          DQ_ENV_PLATFORM: linux/${{ matrix.arch }}
          DQ_ENV_OUT_ARCH: ${{ matrix.arch }}
        run: |
          chmod +x scripts/*.sh
          # Prefer buildx for cross-arch; fall back handled inside script.
          docker buildx version
          make build-env-tar

      - name: Upload env image tar
        uses: actions/upload-artifact@v6
        with:
          name: danmo-work-env-linux-${{ matrix.arch }}
          path: ${{ env.REPO_DIR }}/out/env/danmo-work-env-linux-${{ matrix.arch }}.tar
          if-no-files-found: error

  windows-desktop:
    name: Windows desktop
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ${{ env.REPO_DIR }}

      - name: Checkout dq-ui
        uses: actions/checkout@v6
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.REPO_DIR }}/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Make
        run: choco install make -y --no-progress
        shell: pwsh

      - name: Install & build dq-ui workspace
        working-directory: dq-ui
        run: npm install --no-audit --no-fund
      - name: Build dq-ui packages
        run: npm run build
        working-directory: dq-ui/packages/tokens
      - run: npm run build
        working-directory: dq-ui/packages/ui
      - run: npm run build
        working-directory: dq-ui/packages/shell

      - name: Verify dq-ui checkout
        run: test -f dq-ui/packages/ui/package.json
        shell: bash

      - name: Set release version
        working-directory: ${{ env.REPO_DIR }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Inject version into config files
        working-directory: ${{ env.REPO_DIR }}
        run: |
          V="$RELEASE_VERSION"
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" desktop/src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"$V\"/" desktop/src-tauri/Cargo.toml
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" frontend/package.json
          rm -f desktop/src-tauri/tauri.conf.json.bak desktop/src-tauri/Cargo.toml.bak frontend/package.json.bak
          echo "Version set to $V"

      - name: Prepare Tauri signing key
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          ${{ env.REPO_DIR }}/scripts/ci_prepare_tauri_signing_key.sh

      - name: Build Windows desktop
        working-directory: ${{ env.REPO_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          chmod +x scripts/*.sh
          make pack-windows-desktop RELEASE_VERSION="$RELEASE_VERSION"

      # Authenticode via SignPath (optional). Rewrites PE bytes — must run BEFORE
      # final updater .sig / latest.json. Skips cleanly when SIGNPATH_* unset.
      - name: Detect SignPath
        id: signpath
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        shell: bash
        run: |
          if [[ -n "${SIGNPATH_API_TOKEN:-}" && -n "${SIGNPATH_ORGANIZATION_ID:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ vars.SIGNPATH_RELEASE_SIGNING_READY }}" == "true" ]]; then
              echo "policy=release-signing" >> "$GITHUB_OUTPUT"
            else
              echo "policy=test-signing" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: SIGNPATH_* secrets unset — shipping unsigned Windows installer (SmartScreen)"
          fi

      - name: Stage unsigned installer (flat)
        if: steps.signpath.outputs.enabled == 'true'
        working-directory: ${{ env.REPO_DIR }}
        shell: bash
        run: |
          mkdir -p out/desktop/signpath-upload
          SRC="$(find out/desktop/bundle -type f -name '*x64-setup.exe' | head -1)"
          if [[ -z "$SRC" || ! -f "$SRC" ]]; then
            echo "ERROR: no *x64-setup.exe under out/desktop/bundle" >&2
            exit 1
          fi
          cp -f "$SRC" "out/desktop/signpath-upload/$(basename "$SRC")"
          ls -la out/desktop/signpath-upload/

      - name: Upload unsigned installer for SignPath
        if: steps.signpath.outputs.enabled == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v6
        with:
          name: danmo-work-windows-unsigned-installer
          # Flat layout so SignPath zip root matches Danmo.Work_*_x64-setup.exe
          path: ${{ env.REPO_DIR }}/out/desktop/signpath-upload/*
          if-no-files-found: error
          retention-days: 1

      - name: Authenticode-sign installer (SignPath)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: danmo-work
          signing-policy-slug: ${{ steps.signpath.outputs.policy }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ env.REPO_DIR }}/out/desktop/signed-installer

      - name: Apply signed installer + resign updater
        if: steps.signpath.outputs.enabled == 'true'
        working-directory: ${{ env.REPO_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          chmod +x scripts/*.sh
          SIGNED="$(find out/desktop/signed-installer -type f -name '*x64-setup.exe' | head -1 || true)"
          if [[ -z "$SIGNED" || ! -f "$SIGNED" ]]; then
            echo "ERROR: SignPath output missing *x64-setup.exe under out/desktop/signed-installer" >&2
            find out/desktop/signed-installer -type f 2>/dev/null || true
            exit 1
          fi
          DEST="$(find out/desktop/bundle -type f -name '*x64-setup.exe' | head -1)"
          if [[ -z "$DEST" || ! -f "$DEST" ]]; then
            echo "ERROR: no setup.exe under out/desktop/bundle to replace" >&2
            exit 1
          fi
          cp -f "$SIGNED" "$DEST"
          echo "Replaced $DEST with Authenticode-signed installer"
          scripts/ci_resign_windows_updater.sh out/desktop/bundle

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v6
        with:
          name: danmo-work-desktop-windows
          path: |
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.exe
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.nsis.zip
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.nsis.zip.sig
            ${{ env.REPO_DIR }}/out/desktop/bundle/**/*.sig
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos-desktop, linux-desktop, linux-env-tar, windows-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: ${{ env.REPO_DIR }}
          fetch-depth: 0

      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: danmo-work-desktop-macos
          path: release-assets/macos

      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v7
        with:
          name: danmo-work-desktop-linux
          path: release-assets/linux

      - name: Download env image tar (amd64)
        uses: actions/download-artifact@v7
        with:
          name: danmo-work-env-linux-amd64
          path: release-assets/env

      - name: Download env image tar (arm64)
        uses: actions/download-artifact@v7
        with:
          name: danmo-work-env-linux-arm64
          path: release-assets/env

      - name: Download Windows desktop artifact
        uses: actions/download-artifact@v7
        with:
          name: danmo-work-desktop-windows
          path: release-assets/windows

      - name: Set release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate GitHub latest.json
        id: updater_manifest
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          if find release-assets \( -name '*.app.tar.gz' -o -name '*.AppImage' -o -name '*.AppImage.tar.gz' -o -name '*.nsis.zip' \) | grep -q .; then
            ${{ env.REPO_DIR }}/scripts/generate_updater_latest_json.sh \
              --version "$RELEASE_VERSION" \
              --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
              --asset-dir release-assets \
              --out release-assets/latest.json \
              --notes "Danmo Work $RELEASE_VERSION"
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "No updater artifacts found — skip latest.json (set TAURI_SIGNING_PRIVATE_KEY secret)"
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync China mirror (optional)
        # Includes .dmg for Homebrew cask; skips cleanly if UPDATE_MIRROR_* unset.
        env:
          UPDATE_MIRROR_BASE_URL: ${{ secrets.UPDATE_MIRROR_BASE_URL }}
          UPDATE_MIRROR_S3_URI: ${{ secrets.UPDATE_MIRROR_S3_URI }}
          UPDATE_MIRROR_RCLONE_REMOTE: ${{ secrets.UPDATE_MIRROR_RCLONE_REMOTE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_MIRROR_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_MIRROR_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.UPDATE_MIRROR_AWS_REGION }}
          AWS_ENDPOINT_URL: ${{ secrets.UPDATE_MIRROR_AWS_ENDPOINT_URL }}
        run: |
          chmod +x ${{ env.REPO_DIR }}/scripts/*.sh
          ${{ env.REPO_DIR }}/scripts/sync_updater_mirror.sh \
            --asset-dir release-assets \
            --version "$RELEASE_VERSION"

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/macos/**/*.dmg
            release-assets/macos/**/*.app.tar.gz
            release-assets/macos/**/*.app.tar.gz.sig
            release-assets/linux/**/*.AppImage
            release-assets/linux/**/*.AppImage.sig
            release-assets/linux/**/*.AppImage.tar.gz
            release-assets/linux/**/*.AppImage.tar.gz.sig
            release-assets/linux/**/*.deb
            release-assets/env/**/*.tar
            release-assets/windows/**/*.exe
            release-assets/windows/**/*.nsis.zip
            release-assets/windows/**/*.sig
            release-assets/latest.json
          fail_on_unmatched_files: false

      - name: Bump Homebrew cask
        id: brew_cask
        working-directory: ${{ env.REPO_DIR }}
        run: |
          chmod +x scripts/*.sh
          DMG="$(find "$GITHUB_WORKSPACE/release-assets/macos" -name 'Danmo.Work_*_arm64.dmg' | head -1 || true)"
          if [[ -z "$DMG" || ! -f "$DMG" ]]; then
            echo "No arm64 DMG found — skip Homebrew cask bump"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="$(sha256sum "$DMG" | awk '{print $1}')"
          git fetch origin main
          git checkout -B main origin/main
          ./scripts/update_homebrew_cask.sh --version "$RELEASE_VERSION" --sha256 "$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/danmo-work.rb
          if git diff --staged --quiet; then
            echo "Cask already at $RELEASE_VERSION"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "brew: bump danmo-work to $RELEASE_VERSION"
            git push origin main
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Homebrew tap repo (optional)
        continue-on-error: true
        working-directory: ${{ env.REPO_DIR }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          chmod +x scripts/publish_homebrew_tap.sh
          ./scripts/publish_homebrew_tap.sh

  sync-gitee:
    name: Sync Release to Gitee
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish-release]
    uses: ./.github/workflows/sync-gitee-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
