name: Sync Release to Gitee

# Sync one GitHub Release (assets + Gitee-rewritten latest.json) to
# https://gitee.com/danmo-ai/danmo-work.
# Prefer triggering after Build Release Artifacts finishes (see release.yml),
# or run manually. Requires repository secret GITEE_TOKEN.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.9.18). Empty = latest GitHub release.
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to sync
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Sync release assets to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync single release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: danmo-ai
          GITEE_REPO: danmo-work
          GITHUB_REPOSITORY: danmo-ai/danmo-work
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo "GITEE_TOKEN unset — skip Gitee sync"
            exit 0
          fi
          chmod +x scripts/sync_github_release_to_gitee.sh scripts/publish_gitee_updater_manifest.sh
          ./scripts/sync_github_release_to_gitee.sh
