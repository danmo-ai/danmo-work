name: Sync Release to Gitee

# Publish Gitee Release metadata + GitHub download links, and a tiny Tauri
# latest.json on branch "updater". Does NOT upload installer binaries.
# Artifact host remains GitHub Releases (danmo.work is Pages marketing site).
# Optional secret UPDATE_MIRROR_BASE_URL rewrites links when a real mirror exists.
# Requires repository secret GITEE_TOKEN.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.9.18). Empty = latest GitHub release.
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to sync
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Sync release metadata to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync Gitee release + updater manifest
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: danmo-ai
          GITEE_REPO: danmo-work
          GITHUB_REPOSITORY: danmo-ai/danmo-work
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MIRROR_BASE_URL: ${{ secrets.UPDATE_MIRROR_BASE_URL }}
        run: |
          if [[ -z "${GITEE_TOKEN}" ]]; then
            echo "GITEE_TOKEN unset — skip Gitee sync"
            exit 0
          fi
          chmod +x scripts/sync_github_release_to_gitee.sh scripts/publish_gitee_updater_manifest.sh
          ./scripts/sync_github_release_to_gitee.sh
