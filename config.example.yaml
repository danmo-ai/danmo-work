# Danmo Work configuration file
# Default location: ~/.danmo-work/config.yaml
# All entry points (server, cli, tui, desktop) share this home directory.
# Override with WORK_CONFIG / WORK_DATA_DIR / WORK_DB_PATH if needed.

# Data and persistence paths (defaults resolve under ~/.danmo-work/).
# All paths derive from one root: $WORK_HOME (default ~/.danmo-work).
# Relative paths below resolve against that root.
data:
  dir: "data"                 # -> ~/.danmo-work/data
  database: "work.db"        # -> ~/.danmo-work/work.db (control plane)
  # history_database: ""      # default: history.db next to the control DB (turn entries + stream events)
  store: "sqlite"             # sqlite only today; memory backend reserved for future use.

# HTTP API server settings.
server:
  listen_addr: "0.0.0.0:7801"

# Instance identity used for job-lease coordination.
instance:
  id: ""

# Runtime behaviour tuning.
runtime:
  auto_approve: false
  # Permission mode: discuss | plan | interactive (default) | auto
  # discuss/plan deny writes/exec/MCP; interactive asks on high/external; auto still asks dangerous shell & external MCP.
  # auto_approve skips some waits but NEVER auto-approves dangerous_command or unsandboxed.
  permission_mode: "interactive"
  # Optional Soft Gate rules (pattern → ask|deny). Example:
  # permission_rules:
  #   - pattern: "mcp_*"
  #     action: ask
  #   - pattern: "exec_shell"
  #     action: ask
  # Unified sandbox backends for exec_shell. All backends share one interface:
  #   auto (probe best OS sandbox) | seatbelt | landlock | bwrap | win-token |
  #   wsl2 | podman | docker | apple-container | host-weak (direct OS execution)
  # Modes: read-only | workspace-write | danger-full-access
  # Network: deny | allow | allowlist
  # allowlist: OS net stays open so the process can reach a host-side loopback proxy;
  #   only hosts in allowlist_domains are permitted (exact or "*.example.com").
  #   Empty allowlist_domains fails closed (treated as deny). Clients that ignore
  #   HTTP(S)_PROXY / ALL_PROXY can bypass; v1 does not add iptables/pf redirection.
  # Container backends (podman/docker/apple-container) run one long-lived container
  # per project. The image tar is NOT shipped in app packages — download
  # danmo-work-env-linux-*.tar.gz from GitHub Releases into ~/.danmo-work/env/
  # (or set WORK_ENV_TAR / tar_path). Never registry-pulled; runtime only load.
  #   image/workspace_mount/resources apply only to container backends.
  #   workspace_mount: "" (or "same") = host project abs path so file tools & shell agree.
  #   resources: empty = unlimited (no host auto-infer); set cpus/memory in Settings.
  # Shell interpreter is an internal backend detail (no setting): Windows host /
  # win-token prefers bundled/system Microsoft Coreutils with cmd, then Git Bash,
  # else cmd; WSL2 always uses bash inside Linux; container backends use sh;
  # Unix uses sh. The Windows desktop NSIS installer ships Coreutils by default
  # into ~/.danmo-work/bin/coreutils/.
  # When the sandbox is disabled (or danger-full-access), the factory returns the
  # host-weak backend (direct OS execution).
  # Legacy runtime.environment container settings are migrated here on load.
  sandbox:
    enabled: true
    mode: "workspace-write"
    network: "deny"
    # allowlist_domains:  # empty = fail closed when network=allowlist
    # Settings presets (additive):
    #   开发依赖 — Alpine/apk + Debian/apt + npm + Go + PyPI + GitHub
    #   网络搜索 — DuckDuckGo / Bing / Brave / Google / Baidu / Tavily
    #   单生态 — alpine | debian | npm | go | pypi | crates | github
    # allowlist_domains:
    #   - "dl-cdn.alpinelinux.org"
    #   - "*.alpinelinux.org"
    #   - "deb.debian.org"
    #   - "security.debian.org"
    #   - "*.debian.org"
    #   - "registry.npmjs.org"
    #   - "pypi.org"
    backend: ""
    # ── container-backend params (ignored unless backend is a container engine) ──
    image: "localhost/danmo-work-env:bundled"
    # tar_path: ""  # override tar discovery (WORK_ENV_TAR / ~/.danmo-work/env/ / out/env/)
    workspace_mount: ""  # empty/same = host project abs path; or a fixed in-container path
    resources:
      cpus: ""      # e.g. "2" — empty = unlimited
      memory: ""    # e.g. "2g" — empty = unlimited
      # pids: 0     # docker/podman --pids-limit; 0 = omit
  # Headless browser for web_fetch JS rendering (chromedp + system Chrome/Edge).
  # Does not ship a browser binary. Leave cdp_url empty to auto-launch a local browser.
  browser:
    enabled: true
    executable_path: ""   # optional absolute path to chrome/chromium/edge
    cdp_url: ""           # optional attach URL, e.g. http://127.0.0.1:9222
  # Desktop control for the `computer` tool (find/focus windows, mouse, keyboard,
  # screenshots). Off by default: it drives the host GUI with no sandbox and each
  # call requires approval. Linux needs xdotool + a screenshot tool (imagemagick/
  # scrot/ffmpeg); macOS needs Accessibility+Screen Recording TCC (mouse via
  # cliclick); Windows uses PowerShell.
  computer:
    enabled: false
    display: ""           # optional X11 DISPLAY override on Linux (e.g. ":1")
  turn:
    doom_loop_threshold: 10  # fail after N consecutive identical tool calls (resets when tool/args change)
    max_steps_default: 200   # used when agent.steps is 0 / unset
    max_llm_failures: 3      # fail turn after N consecutive LLM Chat errors (independent of max_steps)
    llm_http_timeout_sec: 600  # per Chat HTTP timeout (seconds); raise for high-effort reasoning models
  compaction:
    enabled: true
    # High water (real tokens): triggers in-turn compaction when the previous
    # step's ACTUAL prompt usage plus the estimated size of messages appended
    # since then exceeds (model context_window − max_output) * trigger_ratio.
    # Budget always comes from the active model's catalog / llm.models entry.
    trigger_ratio: 0.85
    # Low water: retained BYTE-SIZE ratio. After the trigger, dedup + tool
    # result truncation run first, then oldest tool pairs are dropped until
    # the remaining messages shrink to this fraction of the post-dedup/prune
    # byte size (0.5 = drop half). The last keep_recent_tool_steps batches
    # and the current user goal are never dropped.
    low_water_ratio: 0.5
    tool_truncate: 8192        # chars cap per tool result outside the recent window
    keep_recent_tool_steps: 3  # latest tool-call batches kept full during prune/snip
    # Session-level (between-turn) compaction: summarize history older than
    # cut_tokens; trigger every turn_interval turns (sub_interval after the
    # first checkpoint). Optional model override; empty = main model.
    model: ""
    cut_tokens: 16000
    turn_interval: 6
    sub_interval: 4
  tools:
    # Hard cap on a single local tool result (chars) before it enters the LLM
    # context / UI / turn log. Protects against oversized shell or MCP output.
    max_output_chars: 50000
  team:
    max_delegation_depth: 3  # maximum sub-agent delegation chain length
  memory:
    read_top_k: 10           # max memories returned by memory_read per call
  knowledge:
    search_top_k: 3          # knowledge-base chapter hits injected per turn
    chapter_max_tokens: 512  # Markdown chapter merge budget (splitter)
    vector_hybrid: false     # optional BM25+vector hybrid (default off)

# Search / HTTP backend for web_search, web_fetch, and http_request tools.
search:
  # Supported: duckduckgo (default), bing, brave, tavily, bocha, metaso, searxng, baidu, volcengine, sofya
  provider: "duckduckgo"

  # Optional endpoint override.
  # For duckduckgo: a DuckDuckGo-compatible HTML endpoint.
  # For searxng: the SearXNG instance root or /search endpoint (required).
  # Unused for other providers.
  base_url: ""

  # API key. Required for brave, tavily, bocha, baidu, volcengine, sofya, and metaso.
  # Unused for duckduckgo, bing, and searxng.
  api_key: ""

  # Timeout in milliseconds for each search request (default 15000, min 1000, max 60000).
  timeout_ms: 15000

  # Maximum number of search results returned per query (default 5, max 10).
  max_results: 5

  # Optional HTTP(S) proxy for web_search / web_fetch / http_request (falls back to HTTP(S)_PROXY env).
  proxy: ""

  # Optional User-Agent override (defaults to a current Chrome desktop UA).
  user_agent: ""

  # When an API provider fails or returns zero results, fall back to DuckDuckGo/Bing HTML (default true).
  html_fallback: true

# Expert / skill market sources. Built-in official GitHub + Gitee sources are
# applied when this section is empty. Add custom git sources or disable official ones.
market:
  cache_ttl_hours: 6
  sources:
    - id: official-github
      name: Official (GitHub)
      kind: git
      platform: github
      repo: https://github.com/danmo-ai/dq-market
      ref: main
      catalog_path: catalog/index.json
      enabled: true
      priority: 10
    - id: official-gitee
      name: Official (Gitee)
      kind: git
      platform: gitee
      repo: https://gitee.com/danmo-ai/dq-market
      ref: main
      catalog_path: catalog/index.json
      enabled: false
      priority: 20
    # Public ClawHub registry (skills only; nonSuspicious). Enable in Settings → Market.
    - id: clawhub
      name: ClawHub
      kind: clawhub
      repo: https://clawhub.ai
      enabled: false
      priority: 30
    # Curated Tech Leads Club catalog (Snyk-scanned, npm CDN).
    - id: techleads
      name: Tech Leads Club
      kind: techleads
      repo: "@tech-leads-club/skills-catalog"
      ref: latest
      enabled: true
      priority: 25
    # Local sibling repo for development (platform: local, repo = absolute path):
    # - id: local-dq-market
    #   name: Local dq-market
    #   kind: git
    #   platform: local
    #   repo: /path/to/dq-market
    #   ref: main
    #   enabled: true
    #   priority: 5

# LLM provider presets — shown as quick-start templates when adding a provider.
# These are defaults; edit or add entries to customise. The frontend "Add Provider"
# dialog lets users pick from these presets or enter a custom configuration.
llm:
  providers:
    - id: openai
      name: OpenAI
      provider: openai
      base_url: "https://api.openai.com/v1"
      icon: "\U0001F7E2"
      description: "GPT \u7CFB\u5217\u3001o \u7CFB\u5217\u63A8\u7406\u6A21\u578B"
    - id: anthropic
      name: Anthropic
      provider: anthropic
      base_url: "https://api.anthropic.com"
      icon: "\U0001F7E0"
      description: "Claude Sonnet\u3001Opus\u3001Haiku"
    - id: deepseek
      name: DeepSeek
      provider: openai
      base_url: "https://api.deepseek.com"
      icon: "\U0001F535"
      description: "DeepSeek \u7CFB\u5217"
    - id: google
      name: Google Gemini
      provider: openai
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      icon: "\U0001F537"
      description: "Gemini Pro\u3001Flash"
    - id: zhipu
      name: "\u667A\u8C31 (Zhipu)"
      provider: openai
      base_url: "https://open.bigmodel.cn/api/paas/v4"
      icon: "\U0001F7E3"
      description: "GLM-5.1\u3001GLM-5\u3001GLM-4.7"
    - id: qwen
      name: "\u901A\u4E49\u5343\u95EE (Qwen)"
      provider: openai
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      icon: "\U0001F7E1"
      description: "Qwen3.8 Max\u30013.7 Max\u3001Plus\u3001Flash\u3001Coder"
    - id: moonshot
      name: Moonshot (Kimi)
      provider: openai
      base_url: "https://api.kimi.com/coding/v1"
      icon: "\U0001F319"
      description: "Kimi Code\uFF1Ak3\u3001k3-256k\u3001kimi-for-coding"
    - id: minimax
      name: MiniMax
      provider: openai
      base_url: "https://api.minimaxi.com/v1"
      icon: "\U0001F3AD"
      description: "MiniMax M3\u3001M2.7"
    - id: ollama
      name: Ollama (Local)
      provider: openai
      base_url: "http://localhost:11434/v1"
      icon: "\U0001F999"
      description: "本地模型，通过 Ollama 运行"
  
  # ─── Per-model parameter overrides ──────────────────────────────────
  # Available parameters per model entry:
  #   context_window      – context window size in tokens
  #   max_output          – max output tokens (maps to API max_tokens)
  #   temperature         – generation temperature
  #   top_p               – nucleus sampling
  #   frequency_penalty   – OpenAI-compatible repetition penalty
  #   presence_penalty    – OpenAI-compatible presence penalty
  #   stop                – stop sequences
  #   available_efforts   – reasoning effort levels exposed in Composer
  #   thinking_mode       – Anthropic only: "adaptive" or "enabled" (budget)
  #   effort_budget_tokens – Anthropic enabled mode: effort → token budget map
  #   reasoning_dialect    – Chat Completions thinking shape; see core/adapter/llm/REASONING_DIALECTS.md
  #                          (openai|deepseek|qwen|kimi|kimi_code|kimi_k3|glm|minimax|gemini|grok)
  #
  # reasoning_effort levels mapped per provider:
  #   OpenAI-compat:     off | none | minimal | low | medium | high | xhigh
  #     → sent as body["reasoning_effort"] transparently
  #   Anthropic enabled: off | high | max
  #     → sent as { thinking: { type: "enabled", budget_tokens: N } }
  #   Anthropic adaptive: off | low | medium | high | xhigh | max
  #     → sent as { thinking: { type: "adaptive" }, effort, display: "summarized" }
  models:
    # vision: true — model accepts image content parts; omit/false strips images before Chat
    # reasoning_dialect — see core/adapter/llm/REASONING_DIALECTS.md (synced from default_models.yaml)
    - model: gpt-5.6
      reasoning_dialect: openai
      vision: true
      context_window: 1050000
      max_output: 128000
      available_efforts:
      - 'off'
      - none
      - low
      - medium
      - high
      - xhigh
      - max
    - model: gpt-5.6-sol
