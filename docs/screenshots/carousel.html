<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danmo Work — Screenshot Tour</title>
  <meta name="description" content="Bilingual screenshot carousel: multi-agent, Document Stage, browser preview, skills, sandbox, IM." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --line: rgba(148, 163, 184, 0.18);
      --text: #e8eef9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --font: "Noto Sans SC", "Sora", sans-serif;
      --display: "Sora", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1000px 520px at 10% -8%, rgba(56, 189, 248, 0.14), transparent 55%),
        radial-gradient(900px 480px at 90% 0%, rgba(52, 211, 153, 0.10), transparent 50%),
        linear-gradient(180deg, #0a101c 0%, var(--bg) 45%, #0d1524 100%);
      -webkit-font-smoothing: antialiased;
    }

    .top {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.25rem 0 0.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .brand i {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      font-style: normal; font-size: 0.85rem; color: #0b1220; font-weight: 800;
    }
    .lang { margin-left: auto; display: flex; gap: 0.35rem; }
    .lang button {
      appearance: none; border: 1px solid var(--line);
      background: rgba(18, 26, 43, 0.75); color: var(--muted);
      border-radius: 999px; padding: 0.4rem 0.85rem;
      font: inherit; font-size: 0.82rem; cursor: pointer;
      transition: 160ms ease;
    }
    .lang button[aria-pressed="true"] {
      color: var(--text);
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.12);
    }

    .page {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 0.75rem 0 2.5rem;
    }
    .subtitle {
      margin: 0 0 1.25rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .carousel {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(22, 32, 51, 0.96), rgba(12, 18, 32, 0.98));
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .carousel-bar {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }
    .lights { display: flex; gap: 0.4rem; }
    .lights i { width: 10px; height: 10px; border-radius: 50%; display: block; }
    .lights i:nth-child(1) { background: #f87171; }
    .lights i:nth-child(2) { background: #fbbf24; }
    .lights i:nth-child(3) { background: #34d399; }
    .carousel-bar strong { font-family: var(--display); font-size: 0.88rem; }
    .carousel-bar em {
      margin-left: auto;
      font-style: normal;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .viewport {
      position: relative;
      aspect-ratio: 16 / 10;
      background: #060a12;
    }
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 480ms ease;
      pointer-events: none;
    }
    .slide.is-active {
      opacity: 1;
      pointer-events: auto;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .caption {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 2.5rem 1.25rem 1.15rem;
      background: linear-gradient(180deg, transparent 0%, rgba(6, 10, 18, 0.88) 55%, rgba(6, 10, 18, 0.96) 100%);
    }
    .caption h2 {
      margin: 0 0 0.35rem;
      font-family: var(--display);
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .caption p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.82rem, 1.6vw, 0.92rem);
      line-height: 1.5;
      max-width: 42rem;
    }

    .progress {
      height: 2px;
      background: rgba(148,163,184,0.12);
    }
    .progress > i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width linear;
    }
    .is-playing .progress > i { animation: progress-fill var(--cycle, 5s) linear; }
    @keyframes progress-fill { from { width: 0; } to { width: 100%; } }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem 1rem;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
    }
    .nav-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(18, 26, 43, 0.85);
      color: var(--text);
      width: 36px; height: 36px;
      border-radius: 10px;
      font: inherit;
      font-size: 1.1rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: 160ms ease;
    }
    .nav-btn:hover { border-color: rgba(56, 189, 248, 0.45); background: rgba(56, 189, 248, 0.08); }
    .dots {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .dots button {
      appearance: none;
      width: 8px; height: 8px;
      border: none;
      border-radius: 50%;
      background: rgba(148, 163, 184, 0.35);
      padding: 0;
      cursor: pointer;
      transition: 160ms ease;
    }
    .dots button[aria-selected="true"] {
      background: var(--accent);
      transform: scale(1.25);
    }
    .play-toggle {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(18, 26, 43, 0.85);
      color: var(--muted);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .play-toggle[aria-pressed="true"] {
      color: var(--text);
      border-color: rgba(52, 211, 153, 0.45);
      background: rgba(52, 211, 153, 0.10);
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.6rem;
      padding: 0 1rem 1.1rem;
    }
    .thumbs button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      background: #0a1018;
      opacity: 0.72;
      transition: 160ms ease;
    }
    .thumbs button:hover { opacity: 1; }
    .thumbs button[aria-selected="true"] {
      opacity: 1;
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
    }
    .thumbs img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .thumbs span {
      display: block;
      padding: 0.4rem 0.5rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: left;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 720px) {
      .thumbs { display: none; }
      .caption { padding-top: 1.5rem; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand"><i>D</i> Danmo Work</div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main class="page">
    <p class="subtitle" data-i18n="pageSubtitle"></p>

    <div class="carousel is-playing" id="carousel">
      <div class="carousel-bar">
        <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
        <strong data-i18n="barTitle"></strong>
        <em id="counter">1 / 9</em>
      </div>
      <div class="progress"><i id="progress"></i></div>
      <div class="viewport" id="viewport"></div>
      <div class="controls">
        <button type="button" class="nav-btn" id="prev" aria-label="Previous">‹</button>
        <div class="dots" id="dots" role="tablist"></div>
        <button type="button" class="nav-btn" id="next" aria-label="Next">›</button>
        <button type="button" class="play-toggle" id="playToggle" aria-pressed="true" data-i18n="pause"></button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </main>

  <script>
    const SLIDES = [
      {
        img: "ui-team-delegate.png",
        title: { zh: "多 Agent 协作", en: "Multi-agent delegation" },
        caption: {
          zh: "主专家委派研究员与文档子代理，计划面板实时追踪进度。",
          en: "Lead agent delegates Researchers & Document experts; Plan panel tracks every step.",
        },
      },
      {
        img: "ui-market-report.png",
        title: { zh: "调研 → 报告", en: "Research → live report" },
        caption: {
          zh: "检索、写文件、生成 HTML 报告，内置浏览器即时预览。",
          en: "Search, write files, ship an HTML report — preview in the built-in browser.",
        },
      },
      {
        img: "ui-office-coedit.png",
        title: { zh: "Document Stage", en: "Document Stage" },
        caption: {
          zh: "文档 / 幻灯片 / 表格同台编辑，Markdown 为真相源，可导出 PDF。",
          en: "Docs, slides, and sheets on one canvas — Markdown source of truth, PDF export.",
        },
      },
      {
        img: "ui-ai-doc-modify.png",
        title: { zh: "AI 行内编辑", en: "AI inline editing" },
        caption: {
          zh: "选中段落 → 润色 / 扩写 / 修改，不离开 Document Stage。",
          en: "Select text → Polish / Expand / Modify without leaving the canvas.",
        },
      },
      {
        img: "ui-browser-annotate.png",
        title: { zh: "浏览器 + 标注", en: "Browser + annotate" },
        caption: {
          zh: "本地预览网页，点选 DOM 元素标注，精确上下文发回 Composer。",
          en: "Preview locally, click a DOM element, send exact HTML/CSS context to Composer.",
        },
      },
      {
        img: "ui-snake-game.png",
        title: { zh: "代码即预览", en: "Code → preview" },
        caption: {
          zh: "Agent 写完网页小游戏，Browser 标签页里立刻能玩。",
          en: "Agent ships a web game — play it instantly in the Browser tab.",
        },
      },
      {
        img: "ui-skill-editor.png",
        title: { zh: "技能库", en: "Skills library" },
        caption: {
          zh: "内置、自定义与市场技能，应用内编辑 SKILL.md 指令。",
          en: "Built-in, custom, and market skills — edit SKILL.md instructions in-app.",
        },
      },
      {
        img: "ui-runtime-settings.png",
        title: { zh: "沙箱与运行时", en: "Sandbox & runtime" },
        caption: {
          zh: "OS 级沙箱、网络 deny、权限模式、Turn 上限与记忆检索。",
          en: "OS sandbox, network deny, permission modes, turn limits, memory TopK.",
        },
      },
      {
        img: "wx1.png",
        title: { zh: "IM 通道", en: "IM channels" },
        caption: {
          zh: "微信 / 飞书 / QQ / 企微同一条 Loop — 进度与审批在聊天里。",
          en: "WeChat · Feishu · QQ · WeCom — same loop, progress cards in chat.",
        },
      },
    ];

    const COPY = {
      pageSubtitle: {
        zh: "真实产品截图 + 一行功能说明 — 自动轮播，也可点选缩略图跳转。",
        en: "Real product screenshots with one-line captions — auto-advance or pick a thumb.",
      },
      barTitle: {
        zh: "产品截图轮播",
        en: "Screenshot tour",
      },
      pause: { zh: "暂停", en: "Pause" },
      play: { zh: "播放", en: "Play" },
    };

    const params = new URLSearchParams(location.search);
    let lang = params.get("lang") === "en" ? "en" : "zh";
    let index = 0;
    let playing = params.get("autoplay") !== "0";
    let timer = null;
    const INTERVAL = params.get("fast") ? 3500 : 5000;

    const carousel = document.getElementById("carousel");
    const viewport = document.getElementById("viewport");
    const dots = document.getElementById("dots");
    const thumbs = document.getElementById("thumbs");
    const counter = document.getElementById("counter");
    const playToggle = document.getElementById("playToggle");

    function t(key) {
      return (COPY[key] && COPY[key][lang]) || key;
    }

    function applyI18n() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll(".lang button").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
      });
      document.querySelectorAll(".slide").forEach((slide, i) => {
        slide.querySelector("h2").textContent = SLIDES[i].title[lang];
        slide.querySelector("p").textContent = SLIDES[i].caption[lang];
      });
      document.querySelectorAll(".thumbs button span").forEach((span, i) => {
        span.textContent = SLIDES[i].title[lang];
      });
      playToggle.textContent = playing ? t("pause") : t("play");
    }

    function buildSlides() {
      viewport.innerHTML = "";
      dots.innerHTML = "";
      thumbs.innerHTML = "";
      SLIDES.forEach((slide, i) => {
        const el = document.createElement("div");
        el.className = "slide" + (i === 0 ? " is-active" : "");
        el.innerHTML =
          '<img src="' + slide.img + '" alt="" loading="' + (i === 0 ? "eager" : "lazy") + '" />' +
          '<div class="caption"><h2></h2><p></p></div>';
        viewport.appendChild(el);

        const dot = document.createElement("button");
        dot.type = "button";
        dot.setAttribute("role", "tab");
        dot.setAttribute("aria-label", "Slide " + (i + 1));
        dot.addEventListener("click", () => go(i, true));
        dots.appendChild(dot);

        const thumb = document.createElement("button");
        thumb.type = "button";
        thumb.innerHTML =
          '<img src="' + slide.img + '" alt="" loading="lazy" />' +
          "<span></span>";
        thumb.addEventListener("click", () => go(i, true));
        thumbs.appendChild(thumb);
      });
    }

    function updateUI() {
      const slides = viewport.querySelectorAll(".slide");
      slides.forEach((s, i) => s.classList.toggle("is-active", i === index));
      dots.querySelectorAll("button").forEach((d, i) => d.setAttribute("aria-selected", i === index ? "true" : "false"));
      thumbs.querySelectorAll("button").forEach((d, i) => d.setAttribute("aria-selected", i === index ? "true" : "false"));
      counter.textContent = (index + 1) + " / " + SLIDES.length;
      carousel.style.setProperty("--cycle", INTERVAL + "ms");
      carousel.classList.remove("is-playing");
      void carousel.offsetWidth;
      if (playing) carousel.classList.add("is-playing");
    }

    function go(i, user = false) {
      index = (i + SLIDES.length) % SLIDES.length;
      updateUI();
      if (user) restartTimer();
    }

    function restartTimer() {
      clearInterval(timer);
      if (!playing) return;
      timer = setInterval(() => go(index + 1), INTERVAL);
    }

    document.getElementById("prev").addEventListener("click", () => go(index - 1, true));
    document.getElementById("next").addEventListener("click", () => go(index + 1, true));
    playToggle.addEventListener("click", () => {
      playing = !playing;
      playToggle.setAttribute("aria-pressed", playing ? "true" : "false");
      playToggle.textContent = playing ? t("pause") : t("play");
      carousel.classList.toggle("is-playing", playing);
      restartTimer();
    });
    document.querySelectorAll(".lang button").forEach((btn) => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        applyI18n();
        const url = new URL(location.href);
        url.searchParams.set("lang", lang);
        history.replaceState(null, "", url);
      });
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(index - 1, true);
      if (e.key === "ArrowRight") go(index + 1, true);
      if (e.key === " ") {
        e.preventDefault();
        playToggle.click();
      }
    });

    buildSlides();
    applyI18n();
    updateUI();
    restartTimer();
  </script>
</body>
</html>
