# Locked terms — {{title}}
# 本文件是唯一锁词清单。gate precommit 自动扫描当单元正文，命中即 FAIL。
# 写正文前不需要手动复述本文件；gate 会在 CONTEXT 里告诉你本单元哪些词禁出现。
#
# 规则：
# - locked_until: 键 = 卷号（v5/v8），值 = 在该卷之前正文不得出现的词/短语列表。
#   到达该卷后，gate 自动放行（但仍可在 compliance 段保留为永久禁词）。
# - compliance: 永久合规红线（平台/审查），任何卷都不得出现。
# - 解锁流程：某卷正文首次需要该词时，先在 author-lore.md 确认真相，
#   再从 locked_until 对应卷号下删除该词，然后才写正文。不要先写正文再删锁。
# - 锁词只锁"字面出现"，不锁"现象层暗示"（如"那只手"可以，"方子衡"不行）。

locked_until:
  v5:
    - "方子衡"
    - "篡改签名"
    - "南方司法鉴定中心"
  v8:
    - "汪敬亭"
    - "魂穿代价"
    - "两个意识"
    - "凶手是我自己"
  v4:
    - "来自2024"
    - "你早就知道我会死"

# 永久合规红线（示例；按平台/题材增删）
compliance:
  - "看守所内自杀"
  - "纪委带走"
  - "刑讯逼供"
  - "手机"          # 时代锁定 2004–2009 时；若时代不同请改
  - "短信"
  - "微信"
  - "监控调取"
  - "DNA库"
  - "全国联网"

# 别名/变体（gate 会同时扫描）
aliases:
  "方子衡":
    - "方主任"
    - "方专家"
  "汪敬亭":
    - "蓝湾顶层"
