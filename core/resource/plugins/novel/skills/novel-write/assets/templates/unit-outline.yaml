# 单元细纲：一个剧情单元一份。**本文件是单元级唯一事实源。**
# 卷纲分配（unit_id/章范围/一句话功能/终局边界/钩子类型），细纲落笔；两层不合并，本文件不重复卷级判断。
# 头部（unit_id/chapter_range/function/next_hook.type/status/word_*）由 `accept-volume` 按卷纲索引行种下。
# 场面是写作骨架，章只是切口。写正文只消费 preflight 渲染出的「单元卡」，不再通读本文件。
unit_id: v01-U1              # 必填，须在卷纲单元索引表里，如 v01-U1
chapter_range: [1, 5]       # 含端点，与卷纲索引表章范围一致（不一致 blocking）
title_working: ""
word_target: 12500           # 单元总字数，必须等于各章 word_share 之和
word_floor: 10000            # 单元字数地板（precommit 硬检）；默认 = 章数 × word_floor_per_ch
word_ceiling: 14000          # 单元字数天花板；默认 = 章数 × word_ceiling_per_ch
status: proposed             # proposed|accepted|drafted|reviewed

# 上场人物（stem = canon/cast/<stem>.md 文件名）
on_stage: []                 # 本单元开口或被写到的 canon stem；须 ⊆ 卷纲「本卷人物」；含 candidate → blocking
pov: ""                      # 本单元默认 POV stem（须在 on_stage 内）；场面可用 pov 覆盖；preflight 给他注入「不知」

# 故事时钟（相对日序默认；与卷纲「本卷时间线」、novel-state.time_system 对齐）
story_day: null              # 本单元开场相对日序（整数，D0=开书日）；calendar 模式可改用 time_label
gap_from_prev: ""            # 与上一单元的时间差（如「三日后」「同日黄昏」）；首单元写「开卷」
time_label: ""               # 可读时钟（如「秋分前后」）；可选
flashback: false             # true 时允许 story_day 回跳；须在正文明示闪回

# 单元级合同（卷纲不重复这些字段）
function: ""                 # 本单元必须完成的一件事；来自卷纲索引，改动只 warning（以卷纲为准）
entry: ""                    # 因果入口；U1 写开卷切口；由上一单元 next_hook 引出
desire: ""                   # 主角局部目标（保住/拿到/证明什么）
obstacle: ""                 # 得不到的具体原因（敌意/限制/误判/资源缺口）
choice: ""                   # 关键选择：谁、在哪、代价（主角不可替代的判断）
payoff: ""                   # 主兑现，收益可见归谁
pleasure: ""                 # 单元主爽点形态（番茄向必填；不要求每章一条；连续3单元不雷同）
forbidden: []                # 本单元不得出现的词/事件/真相
endgame_boundary: ""         # 本单元终局边界（对照 bible unlock 卷 + locked-terms.yaml）
next_hook:
  type: ""                   # 来自卷纲索引；九类之一；不一致 blocking
  out: ""                    # 单元末具体事件 = 末章切口（只在细纲写）

# 一场 = 一个可写场面，不是一章。每章至少 2 场。
scenes:
  - id: S1
    beat: 建立期待            # 建立期待|尝试|加压|决断|兑现|余波
    chapter: 1
    when: ""                  # 本场故事时（相对上场面或章内锚点）；勿与 where 混写
    where: ""                 # 地点 only（旧稿「time | location」仍可读，accepted 起建议拆开）
    pov: ""                   # 可选，覆盖单元级 pov（须在 on_stage 内）
    who: []                   # 可选，本场在场子集（⊆ on_stage）
    want: ""
    turn: ""
    must_land: []             # 1–3 个可落地的动作/对白事实，禁止口号
    emotional_beat: ""        # 本场主情绪从 X→Y（一句）
    reader_effect: ""         # 期望读者感受（紧张/心疼/解气/代入认同…一句）
    subtext: ""               # 表面在谈什么 | 实际在争什么；无对白写「无」

chapters:
  - chapter: 1
    title_working: ""
    opens_on: S1
    ends_on: S1
    cut_hook: ""              # 章末切口；末章等于 next_hook.out
    word_share: 2500          # 单章目标字数 2000–3500

# 本单元身份/状态跃迁（结构化优先；关系质态变化同步回写 cast 卡，不写编年史）
# 写法 A（推荐）:
#   - stem: zhu-jue
#     field: title            # title|age|location|power|relation|status|other
#     from: "落魄捕快"
#     to: "试用捕头"
#     note: ""                # relation 时写对方 stem + 质态
# 写法 B（兼容旧稿）: "zhu-jue: 落魄捕快→试用捕头"
# preflight 只把 from/当前 snapshot 注入开场身份；to 是单元结束目标，禁止当开场人设
state_deltas: []
info_control:
  reveals: []                # 本单元新揭示给读者的事实
  foreshadowing: []          # "FS-001: plant|advance|payoff"
constraint_checks:
  goldfinger_ratio_ok: true
  timeline_monotonic: true   # gate：非 flashback 时 story_day 相对前序单元不回跳
  active_plot_lines_le_3: true
  endgame_reserve_ok: true
  agency_settled: true
  unit_size_within_bounds: true   # 章数在 unit_scale 范围内（3–8，硬上限10）
continuity_risks: []
