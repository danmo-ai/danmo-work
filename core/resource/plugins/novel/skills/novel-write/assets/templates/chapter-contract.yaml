# 章合同：一章一合同，先合同后正文。字段从简，只写本章用得上的。
chapter: 1
unit_id: ""              # 必填：所属剧情单元，如 v01-U2；空或对不上卷纲 → 退回补卷纲
title_working: ""
scene: ""                # pov | time | location，一行写完
purpose: ""              # 一句话：本章必须完成的叙事任务
beats: []                # 3-5 个必落实节拍，按顺序；可加场景标签（对话/打斗/系统）
forbidden: []            # 本章禁止发生的事 / 不能泄的底
pleasure_point: ""       # 本章爽点（番茄向必填：读者爽在哪）
micro_payoff: ""         # 本章微兑现（追读力 KB）
emotion_line: ""         # 一行情绪曲线，如 压抑→爆发→留钩
state_deltas: []         # "谁: 从X→Y"，只写变化
info_control:
  reveals: []            # 本章放出的信息
  foreshadowing: []      # "FS-001: plant|advance|payoff"
hook:
  type: ""               # 见 KB 爽点与追读：信息缺口|未兑现承诺|高代价选择|身份反转|关系临界|倒计时|未完成动作|突然揭示|回声/意象
  out: ""                # 具体钩子事件，不是口号
reader_debt: []          # 待接上一章钩或开放债务简述
constraint_checks:
  goldfinger_ratio_ok: true
  timeline_monotonic: true
  active_plot_lines_le_3: true
  endgame_reserve_ok: true    # 透支两问皆否（KB 强约束）
  agency_settled: true        # 关键节点四问：收益回到承诺所有者
word_target: 3000        # 番茄常见 2000-3500
continuity_risks: []     # 可能撞车的旧设定
status: proposed         # proposed|accepted|drafted|reviewed
